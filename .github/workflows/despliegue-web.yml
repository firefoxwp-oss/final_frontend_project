# Integración continua y despliegue del cliente web: en cada pull request
# revisa el estándar de codificación (ESLint) y compila; en cada cambio de la
# rama main compila con la dirección del servidor y publica en Azure Static
# Web Apps.
name: Despliegue de la web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Estándar de codificación (ESLint)
        run: npm run lint

      - name: Compilar
        env:
          # Variables del repositorio: dirección del servidor y del sitio corporativo
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SITIO_URL: ${{ vars.VITE_SITIO_URL }}
          BASE_PATH: /
        run: npm run build

      - name: Publicar en Azure Static Web Apps
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
